baseURL = "https://www.underkube.com/"
languageCode = "en-us"
title = "Underkube"
theme = "archie"
googleAnalytics = "UA-143530243-1"
ignoreFiles = ["GEMINI.md,AGENTS.md,CLAUDE.md"]

[params]
  mode = "toggle"
  useCDN = false
  subtitle = "Tips, tricks and all things Kubernetes containers, cloud native, AI, etc"
  author = "Eduardo Mínguez"
  description = "Tips, tricks and all things Kubernetes containers, cloud native, AI, etc"
  logo = "/images/avatar.png"

  # Preserved from old config for overrides
  enableGoogleAnalytics = true
  enableRSS = true

  customCSS = ["css/custom.css"]

[[params.social]]
  name = "GitHub"
  icon = "github"
  url = "https://github.com/e-minguez/underkube"

[[params.social]]
  name = "Twitter"
  icon = "twitter"
  url = "https://www.twitter.com/minwi"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "All Posts"
  url = "/posts"
  weight = 2

[[menu.main]]
  name = "Tags"
  url = "/tags"
  weight = 3

[[menu.main]]
  name = "About"
  url = "/about"
  weight = 4

[[menu.main]]
  name = "Reading List"
  url = "/reading-list/"
  weight = 5
  [menu.main.params]
    class = "button reading-list-button"

[[menu.main]]
  name = "Subscribe"
